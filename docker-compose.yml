name: ${COMPOSE_PROJECT_NAME:-kadr}

services:
  api:
    build:
      context: ./backend
      target: runtime
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: ${KADR_DATABASE_URL:-sqlite+aiosqlite:////data/kadr.db}
      KADR_LOG_LEVEL: ${KADR_LOG_LEVEL:-INFO}
      KADR_CORS_ORIGINS: ${KADR_CORS_ORIGINS:-[]}
      KADR_TMDB_ACCESS_TOKEN: ${KADR_TMDB_ACCESS_TOKEN:-}
      KADR_TMDB_LANGUAGE: ${KADR_TMDB_LANGUAGE:-ru-RU}
      KADR_TMDB_REGION: ${KADR_TMDB_REGION:-RU}
      KADR_TMDB_TIMEOUT_SECONDS: ${KADR_TMDB_TIMEOUT_SECONDS:-8}
      KADR_METADATA_CACHE_TTL_SECONDS: ${KADR_METADATA_CACHE_TTL_SECONDS:-21600}
      KADR_PROWLARR_BASE_URL: ${KADR_PROWLARR_BASE_URL:-http://prowlarr:9696}
      KADR_PROWLARR_API_KEY: ${KADR_PROWLARR_API_KEY:-}
      KADR_PROWLARR_TIMEOUT_SECONDS: ${KADR_PROWLARR_TIMEOUT_SECONDS:-30}
      KADR_PROWLARR_SEARCH_LIMIT: ${KADR_PROWLARR_SEARCH_LIMIT:-100}
    volumes:
      - ./data/database:/data
    expose:
      - "8000"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    environment:
      PUID: ${KADR_UID:-1000}
      PGID: ${KADR_GID:-1000}
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "127.0.0.1:${KADR_PROWLARR_PORT:-9696}:9696"
    networks:
      - kadr-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: sqlite+aiosqlite:////tmp/kadr-test.db
      KADR_LOG_LEVEL: WARNING
    command: ["pytest", "-p", "no:cacheprovider"]
    networks:
      - kadr-internal

  web:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KADR_HTTP_PORT:-8180}:8080"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  web-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "test", "--", "--run"]
    networks:
      - kadr-internal

networks:
  kadr-internal:
    name: ${COMPOSE_PROJECT_NAME:-kadr}-internal
    driver: bridge

