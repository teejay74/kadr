name: ${COMPOSE_PROJECT_NAME:-kadr}

services:
  api:
    build:
      context: ./backend
      target: runtime
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: ${KADR_DATABASE_URL:-sqlite+aiosqlite:////data/kadr.db}
      KADR_LOG_LEVEL: ${KADR_LOG_LEVEL:-INFO}
      KADR_CORS_ORIGINS: ${KADR_CORS_ORIGINS:-[]}
      KADR_TMDB_ACCESS_TOKEN: ${KADR_TMDB_ACCESS_TOKEN:-}
      KADR_TMDB_LANGUAGE: ${KADR_TMDB_LANGUAGE:-ru-RU}
      KADR_TMDB_REGION: ${KADR_TMDB_REGION:-RU}
      KADR_TMDB_TIMEOUT_SECONDS: ${KADR_TMDB_TIMEOUT_SECONDS:-8}
      KADR_METADATA_CACHE_TTL_SECONDS: ${KADR_METADATA_CACHE_TTL_SECONDS:-21600}
      KADR_PROWLARR_BASE_URL: ${KADR_PROWLARR_BASE_URL:-http://prowlarr:9696}
      KADR_PROWLARR_API_KEY: ${KADR_PROWLARR_API_KEY:-}
      KADR_PROWLARR_TIMEOUT_SECONDS: ${KADR_PROWLARR_TIMEOUT_SECONDS:-30}
      KADR_PROWLARR_SEARCH_LIMIT: ${KADR_PROWLARR_SEARCH_LIMIT:-100}
      KADR_QBITTORRENT_BASE_URL: ${KADR_QBITTORRENT_BASE_URL:-http://qbittorrent:8080}
      KADR_QBITTORRENT_USERNAME: ${KADR_QBITTORRENT_USERNAME:-kadr}
      KADR_QBITTORRENT_PASSWORD: ${KADR_QBITTORRENT_PASSWORD:-}
      KADR_QBITTORRENT_TIMEOUT_SECONDS: ${KADR_QBITTORRENT_TIMEOUT_SECONDS:-15}
      KADR_TORRENT_SAVE_PATH: ${KADR_TORRENT_SAVE_PATH:-/downloads/cache}
      KADR_TORRENT_STORAGE_ROOT: ${KADR_TORRENT_STORAGE_ROOT:-/downloads}
      KADR_MIN_FREE_SPACE_GB: ${KADR_MIN_FREE_SPACE_GB:-200}
      KADR_MAX_ACTIVE_TORRENTS: ${KADR_MAX_ACTIVE_TORRENTS:-3}
    volumes:
      - ./data/database:/data
      - ./data/downloads:/downloads:ro
    expose:
      - "8000"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    environment:
      PUID: ${KADR_UID:-1000}
      PGID: ${KADR_GID:-1000}
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "127.0.0.1:${KADR_PROWLARR_PORT:-9696}:9696"
    networks:
      - kadr-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    environment:
      PUID: ${KADR_UID:-1000}
      PGID: ${KADR_GID:-1000}
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads
    ports:
      - "127.0.0.1:${KADR_QBITTORRENT_PORT:-8081}:8080"
    networks:
      - kadr-internal
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: sqlite+aiosqlite:////tmp/kadr-test.db
      KADR_LOG_LEVEL: WARNING
      KADR_MIN_FREE_SPACE_GB: 0
    command: ["pytest", "-p", "no:cacheprovider"]
    networks:
      - kadr-internal

  web:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KADR_HTTP_PORT:-8180}:8080"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  web-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "test", "--", "--run"]
    networks:
      - kadr-internal

networks:
  kadr-internal:
    name: ${COMPOSE_PROJECT_NAME:-kadr}-internal
    driver: bridge

