name: ${COMPOSE_PROJECT_NAME:-kadr}

services:
  api:
    build:
      context: ./backend
      target: runtime
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: ${KADR_DATABASE_URL:-sqlite+aiosqlite:////data/kadr.db}
      KADR_LOG_LEVEL: ${KADR_LOG_LEVEL:-INFO}
      KADR_CORS_ORIGINS: ${KADR_CORS_ORIGINS:-[]}
      KADR_TMDB_ACCESS_TOKEN: ${KADR_TMDB_ACCESS_TOKEN:-}
      KADR_TMDB_LANGUAGE: ${KADR_TMDB_LANGUAGE:-ru-RU}
      KADR_TMDB_REGION: ${KADR_TMDB_REGION:-RU}
      KADR_TMDB_TIMEOUT_SECONDS: ${KADR_TMDB_TIMEOUT_SECONDS:-8}
      KADR_METADATA_CACHE_TTL_SECONDS: ${KADR_METADATA_CACHE_TTL_SECONDS:-21600}
      KADR_PROWLARR_BASE_URL: ${KADR_PROWLARR_BASE_URL:-http://prowlarr:9696}
      KADR_PROWLARR_API_KEY: ${KADR_PROWLARR_API_KEY:-}
      KADR_PROWLARR_TIMEOUT_SECONDS: ${KADR_PROWLARR_TIMEOUT_SECONDS:-30}
      KADR_PROWLARR_SEARCH_LIMIT: ${KADR_PROWLARR_SEARCH_LIMIT:-100}
      KADR_QBITTORRENT_BASE_URL: ${KADR_QBITTORRENT_BASE_URL:-http://qbittorrent:8080}
      KADR_QBITTORRENT_USERNAME: ${KADR_QBITTORRENT_USERNAME:-kadr}
      KADR_QBITTORRENT_PASSWORD: ${KADR_QBITTORRENT_PASSWORD:-}
      KADR_QBITTORRENT_TIMEOUT_SECONDS: ${KADR_QBITTORRENT_TIMEOUT_SECONDS:-15}
      KADR_TORRENT_SAVE_PATH: ${KADR_TORRENT_SAVE_PATH:-/downloads/cache}
      KADR_TORRENT_STORAGE_ROOT: ${KADR_TORRENT_STORAGE_ROOT:-/downloads}
      KADR_LIBRARY_ROOT: ${KADR_LIBRARY_ROOT:-/library}
      KADR_MIN_FREE_SPACE_GB: ${KADR_MIN_FREE_SPACE_GB:-200}
      KADR_MAX_ACTIVE_TORRENTS: ${KADR_MAX_ACTIVE_TORRENTS:-3}
      KADR_MAX_ACTIVE_STREAMS: ${KADR_MAX_ACTIVE_STREAMS:-2}
      KADR_MAX_RANGE_REQUESTS_PER_STREAM: ${KADR_MAX_RANGE_REQUESTS_PER_STREAM:-32}
      KADR_STREAM_START_BUFFER_MB: ${KADR_STREAM_START_BUFFER_MB:-32}
      KADR_STREAM_READ_TIMEOUT_SECONDS: ${KADR_STREAM_READ_TIMEOUT_SECONDS:-30}
      KADR_STREAM_POLL_INTERVAL_SECONDS: ${KADR_STREAM_POLL_INTERVAL_SECONDS:-0.5}
      KADR_STREAM_CHUNK_SIZE_KB: ${KADR_STREAM_CHUNK_SIZE_KB:-1024}
      KADR_PLAYBACK_CACHE_ROOT: ${KADR_PLAYBACK_CACHE_ROOT:-/playback}
      KADR_PLAYBACK_MIN_FREE_SPACE_GB: ${KADR_PLAYBACK_MIN_FREE_SPACE_GB:-5}
      KADR_FFPROBE_TIMEOUT_SECONDS: ${KADR_FFPROBE_TIMEOUT_SECONDS:-15}
      KADR_SUBTITLE_EXTRACTION_TIMEOUT_SECONDS: ${KADR_SUBTITLE_EXTRACTION_TIMEOUT_SECONDS:-120}
      KADR_MAX_ACTIVE_TRANSCODES: ${KADR_MAX_ACTIVE_TRANSCODES:-1}
      KADR_MAX_QUEUED_TRANSCODES: ${KADR_MAX_QUEUED_TRANSCODES:-5}
      KADR_TRANSCODE_VIDEO_THREADS: ${KADR_TRANSCODE_VIDEO_THREADS:-2}
      KADR_TRANSCODE_VIDEO_PRESET: ${KADR_TRANSCODE_VIDEO_PRESET:-veryfast}
      KADR_TRANSCODE_VIDEO_CRF: ${KADR_TRANSCODE_VIDEO_CRF:-23}
      KADR_TRANSCODE_MAX_WIDTH: ${KADR_TRANSCODE_MAX_WIDTH:-1920}
      KADR_TRANSCODE_MAX_HEIGHT: ${KADR_TRANSCODE_MAX_HEIGHT:-1080}
      KADR_TRANSCODE_AUDIO_BITRATE: ${KADR_TRANSCODE_AUDIO_BITRATE:-192k}
      KADR_CACHE_TTL_HOURS: ${KADR_CACHE_TTL_HOURS:-24}
      KADR_CACHE_CLEANUP_INTERVAL_MINUTES: ${KADR_CACHE_CLEANUP_INTERVAL_MINUTES:-60}
    volumes:
      - ${KADR_DATA_ROOT:-./data}/database:/data
      - ${KADR_DATA_ROOT:-./data}/downloads:/downloads
      - ${KADR_DATA_ROOT:-./data}/library:/library
      - ${KADR_DATA_ROOT:-./data}/playback:/playback
    expose:
      - "8000"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    environment:
      PUID: ${KADR_UID:-1000}
      PGID: ${KADR_GID:-1000}
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
    volumes:
      - ${KADR_DATA_ROOT:-./data}/prowlarr:/config
    ports:
      - "127.0.0.1:${KADR_PROWLARR_PORT:-9696}:9696"
    networks:
      - kadr-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    environment:
      LOG_LEVEL: ${KADR_FLARESOLVERR_LOG_LEVEL:-warning}
      LOG_FILE: none
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
    expose:
      - "8191"
    networks:
      - kadr-internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: ${KADR_FLARESOLVERR_SHM_SIZE:-256mb}
    tmpfs:
      - /tmp:size=${KADR_FLARESOLVERR_TMPFS_SIZE:-256m},mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8191/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: ${KADR_FLARESOLVERR_MEMORY_LIMIT:-768M}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    environment:
      PUID: ${KADR_UID:-1000}
      PGID: ${KADR_GID:-1000}
      TZ: ${KADR_TIMEZONE:-Etc/UTC}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${KADR_DATA_ROOT:-./data}/qbittorrent:/config
      - ${KADR_DATA_ROOT:-./data}/downloads:/downloads
    ports:
      - "127.0.0.1:${KADR_QBITTORRENT_PORT:-8081}:8080"
    networks:
      - kadr-internal
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    user: "${KADR_UID:-1000}:${KADR_GID:-1000}"
    environment:
      KADR_DATABASE_URL: sqlite+aiosqlite:////tmp/kadr-test.db
      KADR_LOG_LEVEL: WARNING
      KADR_MIN_FREE_SPACE_GB: 0
      KADR_PLAYBACK_CACHE_ROOT: /tmp/kadr-playback
      KADR_LIBRARY_ROOT: /tmp/kadr-library
    command: ["pytest", "-p", "no:cacheprovider"]
    networks:
      - kadr-internal

  web:
    build:
      context: ./frontend
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KADR_HTTP_PORT:-8180}:8080"
    networks:
      - kadr-internal
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  web-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["npm", "test", "--", "--run"]
    networks:
      - kadr-internal

networks:
  kadr-internal:
    name: ${COMPOSE_PROJECT_NAME:-kadr}-internal
    driver: bridge

